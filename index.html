        /* ---------- Fundo animado ---------- */
        .bg-fx{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
        .bg-fx::after{
          content:"";position:absolute;inset:0;
          background:
            radial-gradient(900px 520px at 50% -12%, rgba(99,102,241,.30), transparent 65%),
            radial-gradient(680px 420px at 3% 8%,  rgba(34,211,238,.14), transparent 62%),
            radial-gradient(720px 480px at 97% 22%, rgba(168,85,247,.16), transparent 62%);
        }
        .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.45;animation:float 20s ease-in-out infinite}
        .blob-a{width:min(46vw,460px);aspect-ratio:1;left:-8%;top:-6%;background:#2563eb}
        .blob-b{width:min(40vw,400px);aspect-ratio:1;right:-6%;top:16%;background:#7c3aed;animation-delay:-9s}
        @keyframes float{

        }

          padding-bottom:calc(56px + env(safe-area-inset-bottom,0px));
        }

          border:1px solid rgba(129,140,248,.28);
          margin-bottom:16px;
        }

        }
